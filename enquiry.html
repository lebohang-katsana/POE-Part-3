<!DOCTYPE html>
<!-- ============================================ -->
<!-- UBUNTU BAKERY - ENQUIRY PAGE                -->
<!-- Author: Lebohang Katsana                     -->
<!-- Date: 14 September 2026                      -->
<!-- Description: This page allows customers to   -->
<!-- submit questions or requests to Ubuntu       -->
<!-- Bakery via a form.                           -->
<!-- ============================================ -->
<html lang="en">
    <head>
        <title>Ubuntu Bakery | Fresh Bread & Pastries</title>
<meta name="description" content="Ubuntu Bakery provides freshly baked bread, pastries, and cakes for the local community. Order online or visit us today.">
        <meta charset="UTF-8">
        <Meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Ubuntu Bakery- Enquiry</title>
             <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
<!-- ===== START OF HEADER ===== -->

        <header>
            <h1>Ubuntu Bakery</h1>
        </header>
<!-- ===== END OF HEADER ===== -->

    <!-- ===== START OF NAVIGATION ===== -->

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
           
        </nav>
<!-- ===== END OF NAVIGATION ===== -->

    <!-- ===== START OF MAIN CONTENT ===== -->

        <main>

            <!-- Enquiry Page Section -->
            <h2>Make an enquiry</h2>

            <!-- Enquiry Form -->
            <form>

                 <!-- Name field -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">
                <br><br>
                
                 <!-- Email field -->
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
                <br><br>

                 <!-- Phone field -->
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <!-- Enquiry Type dropdown -->
                <label for="enquiry-type">Enquiry Type:</label>
                <select id="enquiry-type" name="enquiry-type">
                    <option value="">Please select</option>
                    <option value="products">Products</option>
                    <option value="Special Order">Special Order</option>
                    <option value="general">General Enquiry</option>
                </select>
                <br><br>

                <!-- Message field -->
                <label for="message">Message:</label>
                <br>
                <textarea id="message" name="message" rows="5" cols="30"></textarea>
                <br><br>

                 <!-- Submit button -->
                <button type="submit"
                class="btn">Submit Enquiry</button>
            </form>
        </main>

        <!-- ===== END OF MAIN CONTENT ===== -->

    <!-- ===== START OF FOOTER ===== -->
                <footer>
                    <p>&copy; 2026 Ubuntu Bakery. All rights reserved.</p>
                </footer>
                 <!-- ===== END OF FOOTER ===== -->

                 <!-- JavaScript Form Validation -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Find the form on the page
            const form = document.querySelector('form');
            
            if (form) {
                form.addEventListener('submit', function(event) {
                    // This stops the page from refreshing immediately
                    event.preventDefault(); 

                    // Get the values from the inputs (using the IDs we set earlier)
                    const nameInput = document.getElementById('contact-name');
                    const emailInput = document.getElementById('contact-email');
                    const messageInput = document.getElementById('message');
                    
                    // Check if the inputs exist on this page, if not, leave empty
                    const name = nameInput ? nameInput.value.trim() : "";
                    const email = emailInput ? emailInput.value.trim() : "";
                    const message = messageInput ? messageInput.value.trim() : "";

                    // 1. Check if all fields are filled out
                    if (name === "" || email === "" || message === "") {
                        alert("Please fill in all required fields before submitting.");
                        return; // Stops the code here
                    }

                    // 2. Check if the email looks like a real email (has an @ and a .)
                    if (!email.includes("@") || !email.includes(".")) {
                        alert("Please enter a valid email address.");
                        return; // Stops the code here
                    }

                    // 3. If everything is correct, show a success message
                    alert("Thank you, " + name + ". Your message has been sent successfully to Ubuntu Bakery!");
                    
                    // 4. Clear the form after sending
                    form.reset(); 
                });
            }
        });
    </script>
                
            </body>
            </html>
